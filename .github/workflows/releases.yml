name: Build obsidian plugin

on:
    push:
        tags:
            - "*"

env:
    PLUGIN_NAME: obsidian-git-cn

permissions:
    id-token: write
    contents: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11.25.0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: pnpm
            - name: Build
              id: build
              run: |
                  node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync("manifest.json")); const pkg = JSON.parse(fs.readFileSync("package.json")); const versions = JSON.parse(fs.readFileSync("versions.json")); if (manifest.version !== process.env.GITHUB_REF_NAME || pkg.version !== manifest.version || versions[manifest.version] !== manifest.minAppVersion) throw new Error("发布版本与插件元数据不一致");'
                  pnpm install --frozen-lockfile
                  pnpm run build
                  mkdir ${{ env.PLUGIN_NAME }}
                  cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
                  zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}
            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: false
                  body: 更新内容与升级说明见[更新日志](https://github.com/cyrusgogogo/obsidian-git-cn/blob/${{ github.ref_name }}/CHANGELOG.md)。BRAT 用户可直接更新 `cyrusgogogo/obsidian-git-cn`；要求 Obsidian ≥1.13.1，仅支持桌面端。
                  draft: false
                  prerelease: false
                  fail_on_unmatched_files: true
                  files: |
                      main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip

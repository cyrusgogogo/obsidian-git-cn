<script>
  // 原型独立于插件，所有状态和文件内容均为本地示例，不访问仓库。
  const copy = {
    saved:"原型设置已更新", demo:"这是交互原型，未修改真实插件设置。",
    refreshed:"示例状态已刷新，没有执行 Git 命令。", help:"先查看文件改动，再提交并同步；出现冲突时，自动同步会暂停。",
    paused:"自动同步已暂停", resumed:"自动同步已恢复", manualDisabled:"请先在「自动同步」中启用手动同步。",
    conflictBlocked:"请先检查冲突内容并标记为已解决。", resolveFirst:"请先选择要保留的内容。",
    staged:"示例文件已暂存", resolved:"冲突已标记为解决；提交合并后再恢复同步。",
    syncing:"正在同步…", syncingDetail:"保护本地修改 → 拉取 → 推送（模拟）",
    synced:"所有改动已同步", syncedDetail:"刚刚同步 · 笔记已安全保存", pending:"有改动等待同步", pendingDetail:"上次同步于 3 分钟前",
    conflict:"发现冲突，同步已暂停", conflictDetail:"1 个文件需要你确认 · 本地改动已保护",
    mergeReady:"冲突已解决，等待提交", mergeDetail:"合并提交完成前，自动同步保持暂停",
    safeHint:"同步前自动保护本地修改", conflictHint:"先解决冲突，再提交合并", mergeHint:"提交合并后恢复自动同步",
    syncAction:"提交并同步", mergeAction:"完成合并并同步", noChangesAction:"立即同步",
    methods:{merge:"保留本地与远端历史，自动创建合并提交。推荐用于多设备同步。",rebase:"拉取前保护本地修改；发生变基冲突时，请使用原生 Git 继续或中止。",reset:"先备份本地历史，再使用 --keep 对齐远端；可能覆盖本地修改时会拒绝执行。"},
    pageNames:{automatic:"自动同步",commit:"提交与拉取",repository:"仓库与认证",appearance:"界面与显示"}
  };
  const state={view:"settings",page:"automatic",theme:"dark",method:"merge",scenario:"normal",gitTab:"changes",paused:false,resolution:null,marked:false,syncing:false,synced:false,files:[{name:"长期主义的笔记.md",path:"知识花园",kind:"M",staged:false},{name:"阅读清单.md",path:"知识花园",kind:"M",staged:false},{name:"周记 · 第 42 周.md",path:"日常记录",kind:"A",staged:false}],settings:{manual:true,scheduled:false,boot:true,push:true,smart:true,scope:true,notice:true}};
  const $=selector=>document.querySelector(selector);
  const icon=(name,cls="")=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const toggle=(key,label)=>`<button class="switch" role="switch" aria-label="${label}" aria-checked="${state.settings[key]}" data-toggle="${key}"></button>`;
  let toastTimer,syncTimer;
  function toast(text){$("#toast").innerHTML=icon("check")+text;$("#toast").classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").classList.remove("visible"),2600)}
  function methodBox(){return `<div class="section-heading"><h2>远端改动，如何整合？</h2><span>拉取策略</span></div><div class="method-box"><div class="method-row"><div><h2>整合远端更新</h2><p>选择适合你的历史管理方式</p></div><div class="method-options" aria-label="拉取策略">${["merge","rebase","reset"].map(m=>`<button data-method="${m}" class="${state.method===m?"active":""}" aria-pressed="${state.method===m}">${m}</button>`).join("")}</div></div><div class="method-note">${icon("shield")}<span>${copy.methods[state.method]}</span></div></div>`}
  function header(){return `<div class="breadcrumb"><span>插件设置</span><span>/</span><span>${copy.pageNames[state.page]}</span></div><div class="page-head"><div><h1>${copy.pageNames[state.page]}</h1><p class="description">${({automatic:"专注写作，剩下的交给 Git。",commit:"让每次改动都有清晰、可靠的记录。",repository:"连接你的笔记库，不在插件中保存密码。",appearance:"只显示你真正需要的信息。"})[state.page]}</p></div><span class="save-status">${icon("check")}原型设置 · 仅本地模拟</span></div>`}
  function row(title,desc,control){return `<div class="setting-row"><div><strong>${title}</strong><p>${desc}</p></div>${control}</div>`}
  function renderSettings(){
    let content=header();
    if(state.page==="automatic"){
      content+=`<div class="repo-summary"><div class="repo-icon">${icon("folder")}</div><div class="repo-text"><strong>我的知识库</strong><span>knowledge-garden / origin</span></div><div class="repo-right"><span class="branch">${icon("branch")}main</span><span class="small-status"><i class="status-dot"></i>仓库已连接</span></div></div><div class="section-heading"><h2>选择何时同步</h2><span>四种触发方式，独立控制</span></div><div class="trigger-grid">
      <section class="trigger"><div class="trigger-top">${icon("play")}<h3>手动同步</h3>${toggle("manual","手动同步")}</div><p>需要时主动提交、拉取和推送。</p><div class="trigger-detail"><kbd>⌘ / Ctrl + P</kbd><span>打开命令面板</span></div></section>
      <section class="trigger"><div class="trigger-top">${icon("clock")}<h3>定时执行</h3>${toggle("scheduled","定时执行")}</div><p>按固定间隔拉取与推送远端改动。</p><div class="trigger-detail"><span>每</span><input class="number-input" type="number" min="1" max="1440" value="30" aria-label="定时同步间隔（分钟）"><span>分钟</span><span class="subtle-tag">可分别配置</span></div></section>
      <section class="trigger"><div class="trigger-top">${icon("download")}<h3>启动时拉取</h3>${toggle("boot","启动时拉取")}</div><p>打开笔记库时，先获取最新版本。</p><div class="trigger-detail">${icon("shield")}<span>拉取前保护本地修改</span></div></section>
      <section class="trigger"><div class="trigger-top">${icon("upload")}<h3>提交后推送</h3>${toggle("push","提交后推送")}</div><p>停止编辑后提交，再自动推送到远端。</p><div class="trigger-detail"><span>停止编辑</span><input class="number-input" type="number" min="0" max="1440" value="5" aria-label="停止编辑后自动提交间隔（分钟）"><span>分钟后提交</span></div></section></div>`;
      content+=methodBox()+`<div class="safety-foot"><span>${icon("shield")}冲突时暂停同步，网络恢复后自然重试。</span><button class="text-button" data-view="workbench">查看同步侧栏 ${icon("arrow")}</button></div>`;
    }else if(state.page==="commit"){
      content+=`<div class="section-heading"><h2>提交偏好</h2><span>清晰的记录，从这里开始</span></div><div class="setting-list">${row("智能提交","没有暂存内容时，暂存并提交全部改动。",toggle("smart","智能提交"))}${row("默认提交信息","支持 {{date}}、{{numFiles}} 等占位符。",'<input type="text" aria-label="默认提交信息" value="笔记更新：{{date}}">')}${row("提交模式","明确区分全部改动与已暂存改动。",'<select aria-label="提交模式"><option>智能提交</option><option>仅提交已暂存改动</option><option>提交全部改动</option></select>')}</div><div style="height:24px"></div>`;
      content+=methodBox()+`<div class="info-note">${icon("shield")}合并或变基尚未完成时，不执行自动提交与推送。</div>`;
    }else if(state.page==="repository"){
      content+=`<div class="section-heading"><h2>当前仓库</h2><span>示例连接</span></div><div class="setting-list">${row("笔记库","我的知识库 · 工作分支 main",'<span class="small-status"><i class="status-dot"></i>已连接</span>')}${row("远端","origin · 由系统 Git 管理连接与凭据",'<span class="subtle-tag">不展示私有地址</span>')}${row("限制到笔记库","文件操作不影响笔记库外的内容。",toggle("scope","限制到笔记库"))}</div><div class="section-heading"><h2>认证与安全</h2><span>凭据交给系统</span></div><div class="setting-list">${row("系统凭据助手","使用系统 Git 凭据助手，不保存 Token 或密码。",'<span class="subtle-tag">推荐</span>')}${row("本地修改保护","整合远端之前先保护改动；失败时保留恢复路径。",icon("shield"))}${row("子模块同步","当前版本安全拒绝子模块自动同步，请在终端处理。",'<span class="subtle-tag">安全限制</span>')}</div>`;
    }else{
      content+=`<div class="section-heading"><h2>显示偏好</h2><span>跟随你的工作习惯</span></div><div class="setting-list">${row("界面语言","正式界面支持中文与英文；本原型仅展示中文。",'<span class="subtle-tag">简体中文</span>')}${row("外观主题","正式插件跟随 Obsidian，本原型可切换明暗主题。",`<button class="text-button" data-action="theme">${state.theme==="dark"?"切换到浅色":"切换到深色"} ${icon("arrow")}</button>`)}${row("操作通知","显示提交、拉取和推送的重要结果。",toggle("notice","操作通知"))}${row("错误与冲突","出错时说明原因，给出下一步操作。",'<span class="small-status"><i class="status-dot"></i>始终明确可见</span>')}</div><div class="info-note">${icon("layout")}侧栏采用紧凑布局；常用操作不再藏在图标中。</div>`;
    }
    $("#settingsContent").innerHTML=content;
    document.querySelectorAll("[data-page]").forEach(b=>{b.classList.toggle("active",b.dataset.page===state.page);b.setAttribute("aria-current",b.dataset.page===state.page?"page":"false")});
  }
  function noteContent(){
    if(state.scenario==="conflict"){
      $("#noteTab").textContent="长期主义的笔记 · 冲突处理";
      return `<div class="note-crumb">知识花园 / 长期主义的笔记.md</div><h1>确认你想保留的版本</h1><p>同一段内容在两台设备上被修改了。请检查两个版本，本地改动已有保护性提交。</p><div class="conflict-editor"><div class="conflict-heading"><span>冲突 01 / 01</span><span>note.md</span></div>${state.resolution?`<div class="resolution-message">${icon("check")}已选择${({ours:"本地内容",theirs:"远端内容",both:"双方内容"})[state.resolution]}<br>${state.resolution==="ours"?"每周回顾一次，把零散笔记整理成主题。":state.resolution==="theirs"?"每天花十分钟，连接新想法与旧知识。":"每周回顾一次，把零散笔记整理成主题。<br>每天花十分钟，连接新想法与旧知识。"}</div>`:`<div class="conflict-half"><small>本地版本 · ours</small><p>每周回顾一次，把零散笔记整理成主题。</p></div><div class="conflict-half"><small>远端版本 · theirs</small><p>每天花十分钟，连接新想法与旧知识。</p></div>`}<div class="resolution-buttons"><button data-resolve="ours">保留本地</button><button data-resolve="theirs">保留远端</button><button data-resolve="both">保留双方</button></div></div><div class="info-note">${icon("shield")}${state.marked?"已标记为解决，下一步提交合并。":"检查结果后，在侧栏标记为已解决。"}</div>`;
    }
    $("#noteTab").textContent="长期主义的笔记";
    return `<div class="note-crumb">知识花园 / 长期主义的笔记</div><h1>把笔记变成<br>可以生长的知识。</h1><p>不是记录得越多越好，而是让每一次记录，都能在未来的某个时刻重新发挥价值。</p><blockquote>写下一个想法，是为了让它有机会<br>与另一个想法相遇。</blockquote><h2>留一点空间给思考</h2><p>记录、连接、回顾。一个可靠的知识库，应该让我们专注于内容，而不是担心它有没有被保存。</p><div class="task-line"><span class="check done"></span>把这周的阅读笔记整理到主题页</div><div class="task-line"><span class="check done"></span>给零散想法建立双向链接</div><div class="task-line"><span class="check"></span>周末回顾一次知识花园</div><div class="note-date">${icon("clock")}最后编辑于今天 10:42</div>`;
  }
  function fileRows(files){return files.map(f=>`<div class="file-row ${f.name.startsWith("长期")?"selected":""}" data-file="${f.name}" tabindex="0" role="button" aria-label="查看 ${f.name} 的示例改动">${icon("note")}<div class="file-name">${f.name}<small>${f.path}</small></div><span class="file-status ${f.staged?"staged":f.kind==="A"?"added":""}">${f.staged?"✓":f.kind}</span><button class="stage-button" data-stage="${f.name}" aria-label="${f.staged?"取消暂存":"暂存"} ${f.name}">${f.staged?"−":"+"}</button></div>`).join("")}
  function fileGroup(label,files){return files.length?`<div class="file-section"><div class="file-section-head"><span>${label}</span><span class="count">${files.length}</span>${label==="待暂存"?'<button data-action="stageAll">全部暂存</button>':""}</div>${fileRows(files)}</div>`:""}
  function renderGit(){
    let title=copy.pending,detail=copy.pendingDetail,kind="check";
    if(state.synced){title=copy.synced;detail=copy.syncedDetail}
    if(state.paused&&!state.syncing){title=copy.paused;detail="手动同步仍然可用"}
    if(state.scenario==="conflict"){title=state.marked?copy.mergeReady:copy.conflict;detail=state.marked?copy.mergeDetail:copy.conflictDetail;kind=state.marked?"check":"warning"}
    if(state.syncing){title=copy.syncing;detail=copy.syncingDetail;kind="sync"}
    let content=`<div class="sync-card ${state.scenario==="conflict"?"conflict":""}"><div class="sync-title">${icon(kind)}${title}</div><p>${detail}</p><div class="sync-metrics"><span>↑ ${state.synced?0:2} 待推送</span><span>↓ ${state.scenario==="conflict"?1:0} 待拉取</span><span class="branch">${icon("branch")}main</span></div></div>`;
    if(state.gitTab==="history"){
      content+=`<div class="history">${[["整理知识花园的双向链接","今天 10:39 · 本机","a8f2c10"],["更新阅读清单","今天 09:12 · 本机","e1b98d4"],["新增本周回顾","昨天 21:08 · 另一台设备","0c2d8a1"]].map(e=>`<div class="history-entry"><strong>${e[0]}</strong><small>${e[1]}</small><code>${e[2]}</code></div>`).join("")}</div>`;
    }else if(state.scenario==="conflict"){
      content+=`<div class="file-section"><div class="file-section-head"><span>${state.marked?"已解决，待提交":"需要解决"}</span><span class="count">1</span></div><div class="file-row selected">${icon("note")}<div class="file-name">长期主义的笔记.md<small>知识花园</small></div><span class="file-status">${state.marked?"✓":"!"}</span></div><div style="padding:12px 18px"><button class="text-button" data-action="markResolved">${state.marked?"已标记为解决":state.resolution?"标记为已解决":"先选择冲突内容"} ${icon("arrow")}</button></div></div>`;
    }else if(state.files.length){content+=fileGroup("已暂存",state.files.filter(f=>f.staged))+fileGroup("待暂存",state.files.filter(f=>!f.staged))}
    else{content+=`<div class="file-empty">${icon("check")} 工作区干净，继续安心写作。</div>`}
    $("#gitContent").innerHTML=content;
    $("#syncButton").disabled=state.syncing||(state.scenario==="conflict"&&!state.marked)||!state.settings.manual;
    $("#syncButton span").textContent=state.syncing?copy.syncing:state.scenario==="conflict"?copy.mergeAction:state.files.length?copy.syncAction:copy.noChangesAction;
    $("#commitHint").textContent=state.scenario==="conflict"?(state.marked?copy.mergeHint:copy.conflictHint):copy.safeHint;
    $("#footerState").textContent=state.scenario==="conflict"?"冲突处理中 · 自动同步已暂停":state.paused?copy.paused:"自动同步已开启";
    document.querySelectorAll("[data-git-tab]").forEach(b=>{b.classList.toggle("active",b.dataset.gitTab===state.gitTab);b.setAttribute("aria-pressed",b.dataset.gitTab===state.gitTab)});
  }
  function renderWorkbench(){ $("#noteContent").innerHTML=noteContent(); renderGit() }
  function setView(view){
    state.view=view;const settings=view==="settings";
    $("#settingsNav").classList.toggle("hidden",!settings);$("#settingsContent").classList.toggle("hidden",!settings);$("#noteNav").classList.toggle("hidden",settings);$("#workbench").classList.toggle("hidden",settings);
    document.querySelectorAll(".segments [data-view]").forEach(b=>{b.classList.toggle("active",b.dataset.view===view);b.setAttribute("aria-pressed",b.dataset.view===view)});
    settings?renderSettings():renderWorkbench();
  }
  function setTheme(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=state.theme;$("#themeButton").innerHTML=icon(state.theme==="dark"?"sun":"moon")+`<span>${state.theme==="dark"?"浅色":"深色"}</span>`;if(state.page==="appearance")renderSettings()}
  function setScenario(scenario){
    clearTimeout(syncTimer);state.syncing=false;state.scenario=scenario;state.resolution=null;state.marked=false;state.synced=false;state.paused=false;
    if(scenario==="normal")state.files=[{name:"长期主义的笔记.md",path:"知识花园",kind:"M",staged:false},{name:"阅读清单.md",path:"知识花园",kind:"M",staged:false},{name:"周记 · 第 42 周.md",path:"日常记录",kind:"A",staged:false}];
    document.querySelectorAll("[data-scenario]").forEach(b=>{b.classList.toggle("active",b.dataset.scenario===scenario);b.setAttribute("aria-pressed",b.dataset.scenario===scenario)});
    state.gitTab="changes";setView("workbench");
  }
  function sync(){
    if(state.syncing)return;if(!state.settings.manual){toast(copy.manualDisabled);return}
    if(state.scenario==="conflict"&&!state.marked){toast(copy.conflictBlocked);return}
    state.syncing=true;renderGit();
    syncTimer=setTimeout(()=>{state.syncing=false;state.synced=true;state.scenario="normal";state.marked=false;state.resolution=null;state.files=[];state.paused=false;$("#commitMessage").value="";renderWorkbench();document.querySelectorAll("[data-scenario]").forEach(b=>b.classList.toggle("active",b.dataset.scenario==="normal"));toast("示例同步完成，未执行真实 Git 操作。")},1700);
  }
  document.addEventListener("click",event=>{
    const b=event.target.closest("button");if(!b)return;
    if(b.dataset.view)setView(b.dataset.view);
    else if(b.dataset.page){state.page=b.dataset.page;renderSettings()}
    else if(b.dataset.toggle){state.settings[b.dataset.toggle]=!state.settings[b.dataset.toggle];b.setAttribute("aria-checked",state.settings[b.dataset.toggle]);toast(copy.saved);renderGit()}
    else if(b.dataset.method){state.method=b.dataset.method;renderSettings();toast(copy.saved)}
    else if(b.dataset.scenario)setScenario(b.dataset.scenario);
    else if(b.dataset.gitTab){state.gitTab=b.dataset.gitTab;renderGit()}
    else if(b.dataset.stage){event.stopPropagation();const file=state.files.find(f=>f.name===b.dataset.stage);file.staged=!file.staged;renderGit();toast(copy.staged)}
    else if(b.dataset.resolve){state.resolution=b.dataset.resolve;state.marked=false;renderWorkbench()}
    else if(b.id==="themeButton"||b.dataset.action==="theme")setTheme();
    else if(b.id==="syncButton")sync();
    else if(b.dataset.action==="help")toast(copy.help);
    else if(b.dataset.action==="refresh")toast(copy.refreshed);
    else if(b.dataset.action==="stageAll"){state.files.forEach(f=>f.staged=true);renderGit();toast(copy.staged)}
    else if(b.dataset.action==="markResolved"){if(!state.resolution){toast(copy.resolveFirst);return}state.marked=true;renderWorkbench();toast(copy.resolved)}
    else if(b.dataset.action==="pause"){if(state.scenario==="conflict"){toast(copy.conflictBlocked);return}state.paused=!state.paused;renderGit();toast(state.paused?copy.paused:copy.resumed)}
  });
  function inspectFile(row){if(!row||state.scenario==="conflict")return;$("#noteTab").textContent=row.dataset.file;$("#noteContent").innerHTML=`<div class="note-crumb">${row.dataset.file} / 改动预览</div><h1>这次记录，多了一点新想法。</h1><p>文件预览是原型交互示例，不读取真实笔记。</p><div class="conflict-editor"><div class="conflict-heading" style="background:var(--green-soft);color:var(--green)"><span>新增内容</span><span>+ 2 行</span></div><div class="conflict-half"><p>连接新想法与已有知识。<br>为下次回顾留下一点线索。</p></div></div><div class="info-note">${icon("shield")}暂存文件后，可以一起提交并同步。</div>`}
  document.addEventListener("click",e=>{if(!e.target.closest("button"))inspectFile(e.target.closest("[data-file]"))});
  document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-file]")){e.preventDefault();inspectFile(e.target)}});
  document.addEventListener("change",e=>{if(e.target.matches(".number-input")){const min=Number(e.target.min),max=Number(e.target.max);e.target.value=Math.max(min,Math.min(max,Number(e.target.value)||min))}if(e.target.closest("#settingsContent"))toast(copy.saved)});
  setView("settings");renderGit();
</script>
</body>
</html>
